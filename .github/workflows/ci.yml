# User app and packages/ui only. apps/host is on hold and is not built.
name: CI

on:
  push:
  pull_request:

# Default token stays read-only. The size job widens this so it can comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # apps/user/.metadata stable revision ae9b586f34a8443573f82ef57c3bf914a908cbf7.
  FLUTTER_VERSION: "3.50.1"

jobs:
  user:
    name: Analyze, test, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Second sticky comment (pixel compare) on a pull request.
      pull-requests: write
      issues: read
    env:
      PIXEL_MATCH_WARN_PCT: "95"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 9.3.1 lint calls List.removeLast(), which JDK 17 does not have
          # (fixed in AGP 9.3.2). Gradle runs on 21. The app still targets 17.
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get (packages/ui)
        working-directory: packages/ui
        run: flutter pub get

      - name: Analyze (packages/ui)
        working-directory: packages/ui
        run: flutter analyze

      - name: Test (packages/ui)
        working-directory: packages/ui
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory; skipping."
          fi

      - name: Pub get (apps/user)
        working-directory: apps/user
        run: flutter pub get

      - name: Analyze (apps/user)
        working-directory: apps/user
        run: flutter analyze

      - name: Test (apps/user)
        working-directory: apps/user
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory; skipping."
          fi

      - name: Pixel compare
        id: pixels
        if: success() || failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          summary() {
            printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          table="${RUNNER_TEMP}/pixel-compare.md"
          rm -f "$table"
          if [ ! -f tool/compare_screen.py ]; then
            echo "tool/compare_screen.py is not in this checkout; skipping pixel compare."
            summary "## Pixel compare (apps/user)"
            summary ""
            summary "Skipped: \`tool/compare_screen.py\` is not in this checkout."
            exit 0
          fi
          # PR #5's script has no --tolerance and counts any channel difference.
          # When the flag exists, pass 2. Otherwise run that CLI and score
          # tolerance 2 from the same crop (20px bezel, peak channel).
          use_script_tolerance=0
          if grep -q -- '--tolerance' tool/compare_screen.py; then
            use_script_tolerance=1
          fi
          # Same mechanism as the screen PRs: headless flutter test of
          # apps/user/test/*capture*.dart via tool/capture_user_screens.sh.
          if ! bash tool/capture_user_screens.sh; then
            echo "::warning::User capture tests did not all pass. Comparing whatever build PNGs were written."
          fi
          if ! python3 -c "import PIL.Image" >/dev/null 2>&1; then
            if ! sudo apt-get update -qq || ! sudo apt-get install -y -qq python3-pil; then
              echo "::warning::Could not install Pillow; skipping pixel compare."
              summary "## Pixel compare (apps/user)"
              summary ""
              summary "Skipped: Pillow is not installed."
              exit 0
            fi
          fi

          mapfile -t ids < <(
            find design/screens/user -maxdepth 1 -type f -name '*.png' -printf '%f\n' \
              | sed -nE 's/^([A-Za-z]+[0-9]+)_.*/\1/p' \
              | sort -u
          )
          summary "## Pixel compare (apps/user)"
          summary ""
          summary "Match % is 100 minus the percentage of pixels that differ at tolerance 2 (a per-channel gap of 2 or less still matches). Warning below ${PIXEL_MATCH_WARN_PCT}%. This step does not fail the job. Screen ids come from \`design/screens/user\`. Captures are \`flutter test\` of \`apps/user/test/*capture*.dart\` at 390×844, devicePixelRatio 2."
          summary ""
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No user reference images under design/screens/user."
            summary "No user reference images under \`design/screens/user\`."
            exit 0
          fi

          {
            echo "<!-- kinkstar-pixel-compare -->"
            echo "### User app pixel compare"
            echo ""
            echo "Tolerance 2. Match % is 100 minus the percentage of pixels that differ. A per-channel gap of 2 or less still matches. A match under ${PIXEL_MATCH_WARN_PCT}% is a warning and does not fail CI. Build PNGs come from \`flutter test\` on \`apps/user/test/*capture*.dart\` (390×844 at devicePixelRatio 2, with the app fonts and fonts-noto-core for fallback). n/a means no capture test wrote that screen."
            echo ""
            echo "| Screen | Match % at tolerance 2 |"
            echo "| --- | ---: |"
          } > "$table"

          summary "| Screen | Match % at tolerance 2 |"
          summary "| --- | ---: |"

          for id in "${ids[@]}"; do
            log="${RUNNER_TEMP}/compare-${id}.out"
            err="${RUNNER_TEMP}/compare-${id}.err"
            status=0
            if [ "$use_script_tolerance" -eq 1 ]; then
              python3 tool/compare_screen.py --tolerance 2 "$id" >"$log" 2>"$err" || status=$?
              differ=$(sed -nE "s/^${id} ([0-9]+([.][0-9]+)?)%.*/\1/p" "$log" | head -n 1)
            else
              python3 tool/compare_screen.py "$id" >"$log" 2>"$err" || status=$?
              differ=$(python3 - "$id" <<'PY'
          import sys
          from pathlib import Path

          from PIL import Image, ImageChops

          screen_id = sys.argv[1]
          tolerance = 2
          root = Path(".").resolve()
          build_path = root / "design" / "compare" / f"{screen_id}_build.png"
          matches = sorted((root / "design" / "screens" / "user").glob(f"{screen_id}_*.png"))
          if not build_path.exists() or not matches:
              sys.exit(0)
          reference = Image.open(matches[0]).convert("RGB")
          build = Image.open(build_path).convert("RGB")
          if reference.size != (820, 1728):
              sys.exit(0)
          cropped = reference.crop((20, 20, reference.width - 20, reference.height - 20))
          if cropped.size != build.size:
              sys.exit(0)
          diff = ImageChops.difference(cropped, build)
          bands = diff.split()
          peak = bands[0]
          for band in bands[1:]:
              peak = ImageChops.lighter(peak, band)
          changed = sum(peak.histogram()[tolerance + 1 :])
          total = cropped.width * cropped.height
          percent = 100 * changed / total if total else 0
          print(f"{percent:.2f}")
          PY
              )
            fi
            if [ -n "$differ" ]; then
              match=$(awk -v d="$differ" 'BEGIN { printf "%.2f", 100 - d }')
              echo "${id} differ ${differ}% match ${match}% (exit ${status})"
              echo "| ${id} | ${match} |" | tee -a "$table" >/dev/null
              summary "| ${id} | ${match} |"
              below=$(awk -v m="$match" -v lim="$PIXEL_MATCH_WARN_PCT" 'BEGIN { print (m+0 < lim+0) ? "yes" : "no" }')
              if [ "$below" = "yes" ]; then
                echo "::warning::${id} matches ${match}% of pixels at tolerance 2, below ${PIXEL_MATCH_WARN_PCT}%"
              fi
            else
              echo "${id} no match percentage (exit ${status})"
              if [ -s "$err" ]; then
                cat "$err"
              fi
              echo "| ${id} | n/a |" | tee -a "$table" >/dev/null
              summary "| ${id} | n/a |"
              if [ -s "$err" ] && ! grep -q "missing capture" "$err"; then
                reason=$(head -n 1 "$err")
                echo "::warning::${id} pixel compare did not produce a match percentage: ${reason}"
              fi
            fi
          done
          echo "compared=${#ids[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload screen compare images
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: user-screen-compare
          path: |
            design/compare/*_build.png
            design/compare/*_diff.png
            design/compare/*_side_by_side.png
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: apps/user
        run: flutter build apk --debug

      - name: Update pixel compare comment
        continue-on-error: true
        if: >-
          (success() || failure()) &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/pixel-compare.md"
          if [ ! -s "$body_file" ]; then
            echo "No pixel-compare table to post."
            exit 0
          fi
          if [ "$FORK" = "true" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork pull request; skipping the pixel-compare comment."
            exit 0
          fi

          readonly_token() {
            printf '%s\n' "$1" | grep -q 'Resource not accessible by integration'
          }
          skip_readonly() {
            if [ "$FORK" = "true" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "Fork pull request; skipping the pixel-compare comment."
              exit 0
            fi
            return 1
          }
          post() {
            local method="$1"
            local path="$2"
            local response status
            set +e
            response=$(jq -n --rawfile body "$body_file" '{body:$body}' | gh api --method "$method" "$path" --input - 2>&1)
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$response" >&2
              if readonly_token "$response"; then
                skip_readonly || exit "$status"
              fi
              exit "$status"
            fi
          }

          set +e
          all_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- kinkstar-pixel-compare -->")) | .id' 2>"${RUNNER_TEMP}/pixel-comment-list.err")
          list_status=$?
          set -e
          if [ "$list_status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/pixel-comment-list.err" >&2
            if readonly_token "$(cat "${RUNNER_TEMP}/pixel-comment-list.err")"; then
              skip_readonly || exit "$list_status"
            fi
            exit "$list_status"
          fi
          comment_id=$(printf '%s\n' "$all_ids" | head -n 1)
          if [ -n "$comment_id" ]; then
            echo "Updating pixel comment ${comment_id}"
            post PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
          else
            echo "Creating pixel comment on PR ${PR_NUMBER}"
            post POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          fi

  size:
    name: Play download size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Timeline comments on a pull request use this scope with GITHUB_TOKEN.
      pull-requests: write
      issues: read
    env:
      SIZE_LIMIT_MB: "15"
      BUNDLETOOL_VERSION: "1.18.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Pub get (packages/ui)
        working-directory: packages/ui
        run: flutter pub get

      - name: Pub get (apps/user)
        working-directory: apps/user
        run: flutter pub get

      - name: Build release App Bundle
        working-directory: apps/user
        run: flutter build appbundle --release

      - name: Download bundletool
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

      - name: Measure download size
        id: measure
        env:
          SPEC_ARM64: .github/ci/device-spec-arm64-v8a.json
          SPEC_V7A: .github/ci/device-spec-armeabi-v7a.json
        run: |
          set -euo pipefail
          jar="${RUNNER_TEMP}/bundletool.jar"
          aab="apps/user/build/app/outputs/bundle/release/app-release.aab"
          apks="${RUNNER_TEMP}/app-release.apks"
          test -f "$aab"
          # Release signing in apps/user is the Android debug keystore
          # (store password "android", alias androiddebugkey). bundletool
          # prompts for a password when that keystore exists and --ks-pass is
          # omitted, which would hang CI. These are the public debug
          # credentials, not a secret.
          ks="${HOME}/.android/debug.keystore"
          if [ ! -f "$ks" ]; then
            mkdir -p "${HOME}/.android"
            keytool -genkeypair -keystore "$ks" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          java -jar "$jar" build-apks \
            --bundle="$aab" \
            --output="$apks" \
            --mode=default \
            --overwrite \
            --ks="$ks" \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android

          measure() {
            local name="$1"
            local spec="$2"
            local output max count
            output=$(java -jar "$jar" get-size total --apks="$apks" --device-spec="$spec" 2>&1) || {
              printf '%s\n' "$output" >&2
              echo "bundletool get-size failed for ${name}" >&2
              exit 1
            }
            echo "bundletool get-size total (${name}):" >&2
            printf '%s\n' "$output" >&2
            max=$(printf '%s\n' "$output" | awk -F, '
              {
                for (i = 1; i <= NF; i++) gsub(/^[ \t\r]+|[ \t\r]+$/, "", $i)
                if (NF >= 2 && $(NF-1) ~ /^[0-9]+$/ && $NF ~ /^[0-9]+$/) print $NF
              }
            ')
            count=$(printf '%s\n' "$max" | grep -c '^[0-9][0-9]*$' || true)
            if [ "$count" -ne 1 ]; then
              echo "Expected one MAX download size for ${name}, found ${count}." >&2
              exit 1
            fi
            printf '%s\n' "$max"
          }

          to_mb() {
            awk -v bytes="$1" 'BEGIN { printf "%.2f", bytes / 1000000 }'
          }

          result_for() {
            local bytes="$1"
            local limit_bytes="$2"
            if [ "$bytes" -gt "$limit_bytes" ]; then
              printf 'fail\n'
            else
              printf 'pass\n'
            fi
          }

          arm64_bytes=$(measure "arm64-v8a" "$SPEC_ARM64")
          v7a_bytes=$(measure "armeabi-v7a" "$SPEC_V7A")
          limit_bytes=$((SIZE_LIMIT_MB * 1000000))
          arm64_mb=$(to_mb "$arm64_bytes")
          v7a_mb=$(to_mb "$v7a_bytes")
          arm64_result=$(result_for "$arm64_bytes" "$limit_bytes")
          v7a_result=$(result_for "$v7a_bytes" "$limit_bytes")

          {
            echo "## Play download size (apps/user)"
            echo
            echo "Download size is the MAX value from \`bundletool get-size total\`."
            echo "1 MB = 1,000,000 bytes. Limit: ${SIZE_LIMIT_MB} MB (${limit_bytes} bytes)."
            echo
            echo "| ABI | Download size (MB) | Bytes | Limit (MB) | Result |"
            echo "| --- | ---: | ---: | ---: | --- |"
            echo "| arm64-v8a | ${arm64_mb} | ${arm64_bytes} | ${SIZE_LIMIT_MB} | ${arm64_result} |"
            echo "| armeabi-v7a | ${v7a_mb} | ${v7a_bytes} | ${SIZE_LIMIT_MB} | ${v7a_result} |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "arm64_bytes=${arm64_bytes}"
            echo "arm64_mb=${arm64_mb}"
            echo "arm64_result=${arm64_result}"
            echo "v7a_bytes=${v7a_bytes}"
            echo "v7a_mb=${v7a_mb}"
            echo "v7a_result=${v7a_result}"
          } >> "$GITHUB_OUTPUT"

          echo "arm64-v8a ${arm64_mb} MB (${arm64_bytes} bytes) ${arm64_result}"
          echo "armeabi-v7a ${v7a_mb} MB (${v7a_bytes} bytes) ${v7a_result}"
          echo "limit ${SIZE_LIMIT_MB} MB (${limit_bytes} bytes); 1 MB = 1,000,000 bytes"

      - name: Enforce download size limit
        env:
          ARM64_BYTES: ${{ steps.measure.outputs.arm64_bytes }}
          ARM64_MB: ${{ steps.measure.outputs.arm64_mb }}
          ARM64_RESULT: ${{ steps.measure.outputs.arm64_result }}
          V7A_BYTES: ${{ steps.measure.outputs.v7a_bytes }}
          V7A_MB: ${{ steps.measure.outputs.v7a_mb }}
          V7A_RESULT: ${{ steps.measure.outputs.v7a_result }}
        run: |
          set -euo pipefail
          limit_bytes=$((SIZE_LIMIT_MB * 1000000))
          if [ -z "${ARM64_BYTES}" ] || [ -z "${V7A_BYTES}" ]; then
            echo "Measured download sizes are missing."
            exit 1
          fi
          echo "arm64-v8a ${ARM64_MB} MB (${ARM64_BYTES} bytes) is ${ARM64_RESULT} against ${SIZE_LIMIT_MB} MB"
          echo "armeabi-v7a ${V7A_MB} MB (${V7A_BYTES} bytes) is ${V7A_RESULT} against ${SIZE_LIMIT_MB} MB"
          if [ "$ARM64_BYTES" -gt "$limit_bytes" ] || [ "$V7A_BYTES" -gt "$limit_bytes" ]; then
            echo "Download size is over ${SIZE_LIMIT_MB} MB (${limit_bytes} bytes, 1 MB = 1,000,000 bytes)."
            exit 1
          fi
          echo "Both ABIs are within ${SIZE_LIMIT_MB} MB."

      - name: Update pull request comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false &&
          steps.measure.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          ARM64_BYTES: ${{ steps.measure.outputs.arm64_bytes }}
          ARM64_MB: ${{ steps.measure.outputs.arm64_mb }}
          ARM64_RESULT: ${{ steps.measure.outputs.arm64_result }}
          V7A_BYTES: ${{ steps.measure.outputs.v7a_bytes }}
          V7A_MB: ${{ steps.measure.outputs.v7a_mb }}
          V7A_RESULT: ${{ steps.measure.outputs.v7a_result }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          skip_readonly() {
            if [ "$FORK" = "true" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "Fork pull request; skipping the size comment."
              exit 0
            fi
            return 1
          }
          if [ "$FORK" = "true" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork pull request; skipping the size comment."
            exit 0
          fi

          marker="<!-- kinkstar-download-size -->"
          body_file="${RUNNER_TEMP}/size-comment.md"
          cat > "$body_file" <<EOF
          ${marker}
          ### User app Play download size

          | ABI | Download size (MB) | Limit (MB) | Result |
          | --- | ---: | ---: | --- |
          | arm64-v8a | ${ARM64_MB} | ${SIZE_LIMIT_MB} | ${ARM64_RESULT} |
          | armeabi-v7a | ${V7A_MB} | ${SIZE_LIMIT_MB} | ${V7A_RESULT} |

          1 MB = 1,000,000 bytes. Download size is the MAX from \`bundletool get-size total\` (arm64-v8a ${ARM64_BYTES} bytes, armeabi-v7a ${V7A_BYTES} bytes).
          EOF

          readonly_token() {
            printf '%s\n' "$1" | grep -q 'Resource not accessible by integration'
          }

          post() {
            local method="$1"
            local path="$2"
            local response status
            set +e
            response=$(jq -n --rawfile body "$body_file" '{body:$body}' | gh api --method "$method" "$path" --input - 2>&1)
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$response" >&2
              if readonly_token "$response"; then
                skip_readonly || exit "$status"
              fi
              exit "$status"
            fi
          }

          set +e
          all_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- kinkstar-download-size -->")) | .id' 2>"${RUNNER_TEMP}/comment-list.err")
          list_status=$?
          set -e
          if [ "$list_status" -ne 0 ]; then
            cat "${RUNNER_TEMP}/comment-list.err" >&2
            if readonly_token "$(cat "${RUNNER_TEMP}/comment-list.err")"; then
              skip_readonly || exit "$list_status"
            fi
            exit "$list_status"
          fi
          comment_id=$(printf '%s\n' "$all_ids" | head -n 1)

          if [ -n "$comment_id" ]; then
            echo "Updating comment ${comment_id}"
            post PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
            printf '%s\n' "$all_ids" | tail -n +2 | while read -r extra; do
              [ -z "$extra" ] && continue
              echo "Removing extra size comment ${extra}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${extra}" >/dev/null || true
            done
          else
            echo "Creating size comment on PR ${PR_NUMBER}"
            post POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          fi
